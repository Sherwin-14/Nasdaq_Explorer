name: Lint Code

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - run: |
         python -m pip install --upgrade pip
         pip install ruff

      - name: Lint code
        run: ruff .